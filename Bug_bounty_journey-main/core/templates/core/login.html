{% extends 'core/base.html' %}

{% block title %}Log In - Bug Bounty Mastery{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-slate-900 p-8 rounded-xl border border-slate-800 shadow-2xl">
        <div class="text-center">
            <div class="w-16 h-16 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex items-center justify-center mx-auto text-emerald-400 text-3xl mb-4">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2 class="text-3xl font-extrabold text-white">Sign In to Mastery</h2>
            <p class="mt-2 text-sm text-slate-400">Access your 12-week bug bounty training portal</p>
        </div>

        <form class="mt-8 space-y-6" method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="space-y-4">
                <div>
                    <label for="username" class="block text-sm font-medium text-slate-300">Username</label>
                    <input id="username" name="username" type="text" required class="mt-1 block w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-300">Password</label>
                    <input id="password" name="password" type="password" required class="mt-1 block w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
            </div>

            <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent text-sm font-bold rounded-lg text-slate-950 bg-emerald-500 hover:bg-emerald-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-emerald-500 transition shadow-lg shadow-emerald-500/20">
                Sign In
            </button>
        </form>

        <div class="text-center text-sm text-slate-400">
            Don't have an account? <a href="{% url 'register' %}" class="text-emerald-400 hover:underline font-semibold">Start 5-Day Free Trial</a>
        </div>
    </div>
</div>
{% endblock %}
